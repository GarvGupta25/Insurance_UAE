[project]
name = "helm-api"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3", "psycopg[binary,pool]>=3.2,<4", "httpx>=0.28,<1",
  "python-multipart>=0.0.20", "cryptography>=44", "groq>=0.30,<1",
  "langgraph>=1,<2", "langgraph-checkpoint-postgres>=3,<4",
  "reportlab>=4.3,<5", "pymupdf>=1.25,<2", "pillow>=11,<13", "pytesseract>=0.3.13,<1", "av>=15,<17"
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
